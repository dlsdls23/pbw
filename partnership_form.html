<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제휴 문의</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box; /* Important for padding */
            font-size: 16px;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>제휴 문의하기</h2>
    <form action="https://formspree.io/f/xnjrkweo" method="POST">
        <div class="form-group">
            <label for="name">성함 / 담당자명</label>
            <input type="text" id="name" name="name" required placeholder="홍길동">
        </div>
        
        <div class="form-group">
            <label for="email">이메일 주소</label>
            <input type="email" id="email" name="_replyto" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="company">회사명 / 서비스명</label>
            <input type="text" id="company" name="company" placeholder="회사 이름을 입력해주세요">
        </div>

        <div class="form-group">
            <label for="message">문의 내용</label>
            <textarea id="message" name="message" required placeholder="제휴 제안 내용을 상세히 적어주세요"></textarea>
        </div>

        <!-- Formspree settings -->
        <input type="hidden" name="_subject" value="새로운 제휴 문의가 접수되었습니다!">
        
        <button type="submit">문의 보내기</button>
    </form>
</div>

</body>
</html>
