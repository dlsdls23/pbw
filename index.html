<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>크래시 그래프 X 독박 데스매치 📈🎲</title>
    <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0b12;
            --card-bg: #161626;
            --neon-green: #39ff14;
            --neon-pink: #ff007f;
            --neon-blue: #00f0ff;
            --neon-yellow: #ffea00;
            --neon-gray: #8b8ba8;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'DungGeunMo', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        h1 {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            font-size: 2.2rem;
            margin: 5px 0 2px 0;
            text-align: center;
        }

        .sub-title {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            font-size: 1.1rem;
            margin: 0 0 15px 0;
            text-align: center;
        }

        .balance-box {
            background: #05050a;
            border: 2px solid var(--neon-yellow);
            box-shadow: 0 0 12px rgba(255, 234, 0, 0.3);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 1.3rem;
            color: var(--neon-yellow);
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
            text-shadow: 0 0 5px rgba(255, 234, 0, 0.5);
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
        }

        .tab-btn {
            flex: 1;
            background: #22223b;
            color: var(--neon-gray);
            border: 2px solid #3d3d5e;
            padding: 12px 0;
            font-family: 'DungGeunMo', sans-serif;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #2d2d44;
            color: #fff;
            border-color: var(--neon-pink);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .container {
            background: var(--card-bg);
            border: 3px solid #3d3d5e;
            border-radius: 12px;
            padding: 20px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        .display-box {
            background: #05050a;
            border: 2px solid #3d3d5e;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 220px;
        }

        .mult-overlay {
            position: absolute;
            top: 25px;
            left: 55px;
            font-size: 3.5rem;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        .countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5.5rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 25px var(--neon-yellow);
            font-weight: bold;
            pointer-events: none;
            z-index: 20;
            display: none;
            text-align: center;
            width: 100%;
        }

        .btn-cashout {
            width: 100%;
            background: linear-gradient(135deg, #ffea00, #ffb700);
            color: #000;
            border: 2px solid #fff;
            padding: 16px 0;
            font-family: 'DungGeunMo', sans-serif;
            font-size: 1.4rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.6);
            margin-bottom: 15px;
            display: none;
            z-index: 50;
        }

        .mega-celebration-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 20px #ff007f, 0 0 40px #00f0ff;
            font-weight: bold;
            z-index: 9999;
            display: none;
            text-align: center;
            width: 85%;
            max-width: 420px;
            background: rgba(11, 11, 18, 0.95);
            padding: 30px 20px;
            border: 4px double var(--neon-yellow);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(255, 234, 0, 0.8);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            cursor: pointer;
        }

        @keyframes popIn { to { transform: translate(-50%, -50%) scale(1); } }

        #status-text {
            position: absolute;
            bottom: 32px;
            left: 55px;
            font-size: 1.1rem;
            color: var(--neon-yellow);
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 5px #000;
        }

        .shake { animation: shakeEffect 0.4s ease-in-out; }
        @keyframes shakeEffect {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-3px, 2px); }
            20%, 40%, 60%, 80% { transform: translate(3px, -2px); }
        }

        .mode-selection {
            display: flex;
            justify-content: space-around;
            background: #11111e;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid #3d3d5e;
        }

        .bet-section { display: flex; gap: 15px; margin-bottom: 15px; }
        .bet-card { flex: 1; background: #1f1f34; border: 2px solid #3d3d5e; border-radius: 8px; padding: 12px; text-align: center; }
        .choice-btns { display: flex; gap: 8px; }
        .choice-btns button {
            flex: 1; background: #2d2d44; color: #fff; border: 2px solid #fff; padding: 8px 0;
            font-family: 'DungGeunMo', sans-serif; font-size: 1.1rem; cursor: pointer; border-radius: 4px;
        }
        .choice-btns button.active-odd { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
        .choice-btns button.active-even { background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }

        .target-section { background: #1f1f34; border: 2px solid #3d3d5e; border-radius: 8px; padding: 12px; margin-bottom: 12px; text-align: center; }
        .target-section input { background: #000; border: 2px solid #fff; color: var(--neon-green); font-family: 'DungGeunMo', sans-serif; font-size: 1.2rem; padding: 6px; width: 130px; text-align: center; border-radius: 4px; }

        .quick-bet-container {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .quick-bet-container button {
            flex: 1; min-width: 60px; background: #2a2a40; color: #fff; border: 1px solid #555; padding: 6px 0;
            font-family: 'DungGeunMo', sans-serif; font-size: 0.9rem; cursor: pointer; border-radius: 4px;
        }
        .quick-bet-container button.btn-allin { background: var(--neon-pink); border-color: #fff; color: #fff; font-weight: bold; }
        .quick-bet-container button.btn-reset-bet { background: #44445c; border-color: #aaa; color: #fff; }

        #team-panel { background: #111122; border: 2px solid #4d4d7a; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 5px; }
        .team-header button { background: #3a3a5e; color: #fff; border: 1px solid #777; padding: 4px 6px; font-family: 'DungGeunMo'; cursor: pointer; border-radius: 4px; font-size: 0.85rem; }
        .team-title { font-size: 1.05rem; color: var(--neon-pink); margin: 0; }
        .member-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; background: #1a1a2e; padding: 6px 10px; border-radius: 4px; }
        .member-row.saved { opacity: 0.4; background: #2b0d18; border: 1px solid var(--neon-pink); }
        .member-idx { color: var(--neon-blue); font-weight: bold; width: 25px; }
        .member-input { background: #000; border: 1px solid #555; color: #fff; font-family: 'DungGeunMo'; padding: 4px; width: 80px; border-radius: 4px; }
        .team-target-input { background: #000; border: 1px solid #fff; color: var(--neon-green); font-family: 'DungGeunMo'; font-size: 1rem; padding: 4px; width: 80px; text-align: center; border-radius: 4px; }

        .team-action-zone { margin-bottom: 15px; text-align: center; }
        .btn-confirm-team { width: 100%; background: var(--neon-green); color: #000; border: 2px solid #fff; padding: 12px 0; font-family: 'DungGeunMo'; font-size: 1.3rem; font-weight: bold; cursor: pointer; border-radius: 8px; }
        
        .disabled-panel { opacity: 0.35; pointer-events: none; }

        .result-panel { background: #252538; border: 2px dashed #fff; border-radius: 8px; padding: 15px; display: none; margin-top: 15px;}
        .result-title { font-size: 1.3rem; text-align: center; margin-bottom: 10px; color: var(--neon-yellow); }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1.1rem; }
        #team-round-report { background: #000; padding: 8px; border-radius: 4px; font-size: 0.95rem; color: #9fffff; margin-top: 5px; border: 1px solid #3d3d5e; }

        .history-section { margin-top: 15px; background: #11111e; border: 2px solid #3d3d5e; border-radius: 8px; padding: 12px; width: 100%; box-sizing: border-box; }
        .history-title { font-size: 1rem; color: var(--neon-blue); margin-bottom: 8px; text-align: center; }
        .history-list { display: flex; flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 5px; white-space: nowrap; }
        .history-item { background: #000; border: 1px solid #444; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-block; }
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge.bg-odd { background: var(--neon-pink); color: white; }
        .badge.bg-even { background: var(--neon-blue); color: white; }

        .btn-reset-balance { position: fixed; bottom: 20px; right: 20px; background: var(--neon-yellow); color: #000; border: 2px solid #000; padding: 10px 16px; font-family: 'DungGeunMo'; font-size: 0.95rem; font-weight: bold; cursor: pointer; border-radius: 30px; z-index: 99999; }
    </style>
</head>
<body>

    <div class="mega-celebration-overlay" id="mega-banner" onclick="closeMegaBanner()"></div>

    <div class="balance-box">
        💰 보유 머니: <span id="balance-amount" style="font-weight: bold; color: #fff;">100,000</span> 원
    </div>

    <h1>양재 아센팟 음료내기</h1>
    <div class="sub-title">작은 민기가 사랑하는 그래프!</div>
    
    <div class="tab-container">
        <button id="tab-solo" class="tab-btn active" onclick="switchMainTab('SOLO')">👤 개인전 모드</button>
        <button id="tab-team" class="tab-btn" onclick="switchMainTab('TEAM')">☠️ 독박 단체전</button>
    </div>

    <div class="container">
        <div class="display-box" id="screen-box">
            <canvas id="graphCanvas" width="460" height="220"></canvas>
            <div class="mult-overlay" id="multiplier">1.00x</div>
            <div class="countdown-overlay" id="countdown-timer">5.00</div>
            <div id="status-text">배팅을 준비하세요!</div>
        </div>

        <button class="btn-cashout" id="btn-cashout" onclick="triggerSoloCashOutLogic()">💸 지금 탈출하기 (적립: 0원)</button>

        <div id="solo-ui-group">
            <div class="target-section" style="border: 2px solid var(--neon-yellow);">
                <label style="color: var(--neon-yellow); font-weight: bold;">🪙 베팅 머니 설정 :</label>
                <input type="number" id="solo-bet-input" value="0" min="0" style="color: var(--neon-yellow); font-weight:bold; border-color:var(--neon-yellow);"> 원
                <div class="quick-bet-container">
                    <button type="button" onclick="quickSetBet(10000)">+1만</button>
                    <button type="button" onclick="quickSetBet(35000)">+3.5만</button>
                    <button type="button" onclick="quickSetBet(50000)">+5만</button>
                    <button type="button" class="btn-allin" onclick="quickSetBet('ALL')">올인🔥</button>
                    <button type="button" class="btn-reset-bet" onclick="quickSetBet('RESET')">초기화</button>
                </div>
            </div>
            <div class="mode-selection">
                <label style="cursor:pointer;"><input type="radio" name="gameMode" value="OE" checked onchange="switchSoloSubMode()"> 홀짝 예측 (1.98배)</label>
                <label style="cursor:pointer;"><input type="radio" name="gameMode" value="GRAPH" onchange="switchSoloSubMode()"> 실시간 배수 탈출</label>
            </div>
            <div class="bet-section" id="oe-panel">
                <div class="bet-card" style="border-color: var(--neon-pink);">
                    <div class="choice-btns">
                        <button id="btn-odd" onclick="selectSoloOE('ODD')">홀 (O)</button>
                        <button id="btn-even" onclick="selectSoloOE('EVEN')">짝 (E)</button>
                    </div>
                </div>
            </div>
            <div class="target-section" id="graph-panel">
                <div style="margin-bottom: 12px;">
                    <label style="color: var(--neon-green);">목표 자동 탈출 배수 :</label>
                    <input type="number" step="0.01" id="target-input" value="" placeholder="공백 시 수동탈출">
                </div>
                <button id="btn-graph-bet" onclick="placeGraphBet()" style="width: 100%; background: var(--neon-green); color: #000; border: 2px solid #fff; padding: 10px 0; font-family: 'DungGeunMo'; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 6px;">📈 배수 탈출 배팅하기</button>
            </div>
        </div>

        <div id="team-ui-group" style="display: none;">
            <div id="team-panel">
                <div class="team-header">
                    <span class="team-title" id="team-board-title">☠️ 독박 서바이벌 대기</span>
                    <div>
                        <button onclick="addMember()">➕ 참가자</button>
                        <button onclick="removeMember()">➖ 참가자</button>
                        <button style="background: #ff0055;" onclick="forceResetWholeMatch()">🔄 초기화</button>
                    </div>
                </div>
                <div id="member-list-box"></div>
            </div>
            <div class="team-action-zone">
                <button class="btn-confirm-team" id="btn-team-submit" onclick="handleTeamAction()">🚨 준비 완료 / 단체전 시작</button>
            </div>
        </div>

        <div class="result-panel" id="result-area">
            <div class="result-title">━━ 경기 결과 판정 ━━</div>
            <div class="result-row"><span>최종 종료 배수:</span> <span id="res-final-mult" style="font-weight:bold;">1.00x</span></div>
            <div class="result-row"><span>마지막 자리 숫자:</span> <span id="res-last-digit">0</span></div>
            <hr style="border: 1px dashed #3d3d5e; margin: 12px 0;">
            <div class="result-row" style="flex-direction:column; gap:5px;">
                <span style="font-weight: bold; color:var(--neon-yellow);">판정 브리핑:</span>
                <span id="res-final-status">판정 중</span>
                <div id="team-round-report" style="display:none;"></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">⏱️ 최근 20경기 기록 (개인전 전용)</div>
            <div class="history-list" id="history-box"><div style="color:#555; font-size:0.9rem;">기록이 없습니다.</div></div>
        </div>
    </div>

    <button class="btn-reset-balance" onclick="resetUserBalance()">💵 다빈에게 돈빌리기</button>

    <script>
        // 공용 기본 스키마
        let userBalance = 100000;
        let mainTab = 'SOLO'; 
        let historyData = [];

        // 👤 [엔진 1] 개인전 게임 상태 객체
        let soloGame = {
            state: 'COUNTDOWN', // COUNTDOWN, RUNNING, CRASHED
            multiplier: 1.00,
            crashPoint: 0,
            tickCounter: 0,
            gridOffset: 0,
            points: [{tick: 0, mult: 1.00}],
            countdownLeft: 5.00,
            betAmount: 0,
            isBetLocked: false,
            selectedOE: null,
            hasCashedOut: false,
            subMode: 'OE',
            statusText: '배팅을 준비하세요!',
            statusColor: 'var(--neon-yellow)'
        };

        // ☠️ [엔진 2] 단체전 게임 상태 객체 (완전 격리)
        let teamGame = {
            state: 'IDLE', // IDLE, COUNTDOWN, RUNNING, FINISHED
            multiplier: 1.00,
            crashPoint: 0,
            tickCounter: 0,
            gridOffset: 0,
            points: [{tick: 0, mult: 1.00}],
            countdownLeft: 5.00,
            statusText: '✍️ 제 1라운드 준비!',
            statusColor: 'var(--neon-yellow)'
        };

        // 단체전 회원 구조
        let teamMembers = [{ id: 1, name: '유저1', alive: true }, { id: 2, name: '유저2', alive: true }, { id: 3, name: '유저3', alive: true }];
        let teamRound = 1;

        // 캔버스 초기화
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const paddingLeft = 50;
        const paddingBottom = 25;
        const plotWidth = canvas.width - paddingLeft - 15;
        const plotHeight = canvas.height - paddingBottom - 15;

        // DOM 캐싱
        const multDisplay = document.getElementById('multiplier');
        const countdownDisplay = document.getElementById('countdown-timer');
        const megaBanner = document.getElementById('mega-banner');
        const statusDisplay = document.getElementById('status-text');
        const screenBox = document.getElementById('screen-box');
        const resultArea = document.getElementById('result-area');
        const historyBox = document.getElementById('history-box');
        const cashoutBtn = document.getElementById('btn-cashout');

        // 인터벌 ID 저장소
        let soloCountdownInterval = null;
        let soloGameInterval = null;
        let teamCountdownInterval = null;
        let teamGameInterval = null;

        // 초기 시작 및 명단 생성
        buildTeamUI();
        updateBalanceDOM();
        loopSoloCountdown(); // 개인전 무한 루프 시작

        function updateBalanceDOM() {
            document.getElementById('balance-amount').innerText = userBalance.toLocaleString();
        }

        function resetUserBalance() {
            if (confirm("다빈이에게 대출을 신청하시겠습니까? 💸\n승인 시 보유 머니가 즉시 100,000원으로 충전됩니다.")) {
                userBalance = 100000;
                updateBalanceDOM();
            }
        }

        function quickSetBet(amount) {
            if (soloGame.state !== 'COUNTDOWN' || soloGame.isBetLocked) return;
            const betInput = document.getElementById('solo-bet-input');
            if (amount === 'ALL') betInput.value = userBalance;
            else if (amount === 'RESET') betInput.value = 0;
            else {
                let currentVal = parseFloat(betInput.value) || 0;
                let newVal = currentVal + amount;
                if (newVal > userBalance) newVal = userBalance;
                betInput.value = newVal;
            }
        }

        // ==========================================
        // 🔄 탭 전환 핸들러 (서로 독립된 상태를 투영)
        // ==========================================
        function switchMainTab(tab) {
            mainTab = tab;
            document.getElementById('tab-solo').className = (tab === 'SOLO') ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-team').className = (tab === 'TEAM') ? 'tab-btn active' : 'tab-btn';

            if (tab === 'SOLO') {
                document.getElementById('solo-ui-group').style.display = 'block';
                document.getElementById('team-ui-group').style.display = 'none';
                switchSoloSubMode();
                
                if (soloGame.state === 'CRASHED') {
                    resultArea.style.display = 'block';
                    screenBox.classList.add('shake');
                } else {
                    resultArea.style.display = 'none';
                    screenBox.classList.remove('shake');
                }
            } else {
                document.getElementById('solo-ui-group').style.display = 'none';
                document.getElementById('team-ui-group').style.display = 'block';
                refreshTeamUIState();
                
                if (teamGame.state === 'FINISHED') {
                    resultArea.style.display = 'block';
                    screenBox.classList.add('shake');
                } else {
                    resultArea.style.display = 'none';
                    screenBox.classList.remove('shake');
                }
            }
            updateUIElements();
        }

        function switchSoloSubMode() {
            const mode = document.querySelector('input[name="gameMode"]:checked').value;
            soloGame.subMode = mode;
            if (mode === 'OE') {
                document.getElementById('oe-panel').classList.remove('disabled-panel');
                document.getElementById('graph-panel').classList.add('disabled-panel');
            } else {
                document.getElementById('oe-panel').classList.add('disabled-panel');
                document.getElementById('graph-panel').classList.remove('disabled-panel');
            }
        }

        // ==========================================
        // 👤 [엔진 1 Logic] 개인전 모드 루프 제어
        // ==========================================
        function loopSoloCountdown() {
            soloGame.state = 'COUNTDOWN';
            soloGame.multiplier = 1.00;
            soloGame.tickCounter = 0;
            soloGame.gridOffset = 0;
            soloGame.points = [{tick: 0, mult: 1.00}];
            soloGame.countdownLeft = 5.00;
            soloGame.hasCashedOut = false;
            soloGame.betAmount = 0;
            soloGame.isBetLocked = false;
            soloGame.selectedOE = null;

            document.getElementById('btn-odd').className = '';
            document.getElementById('btn-even').className = '';
            document.getElementById('btn-graph-bet').innerText = '📈 배수 탈출 배팅하기';

        function selectSoloOE(choice) {
            if (soloGame.state !== 'COUNTDOWN' || soloGame.isBetLocked) return;

            soloGame.selectedOE = choice;
            document.getElementById('btn-odd').className = (choice === 'ODD') ? 'active-odd' : '';
            document.getElementById('btn-even').className = (choice === 'EVEN') ? 'active-even' : '';
            soloGame.betAmount = betInputVal;

        function placeGraphBet() {
            if (soloGame.state !== 'COUNTDOWN' || soloGame.isBetLocked) return;
            let betInputVal = parseFloat(document.getElementById('solo-bet-input').value) || 0;
            if (betInputVal <= 0) return alert("베팅 금액을 입력해주세요!");
            if (betInputVal > userBalance) return alert("잔액이 부족합니다!");

            soloGame.betAmount = betInputVal;

            updateBalanceDOM();
            soloGame.isBetLocked = true;

            soloGame.statusText = `📈 배수 배팅 완료 (${soloGame.betAmount.toLocaleString()}원)`;
            updateUIElements();
        }

        function startSoloGame() {
            soloGame.state = 'RUNNING';
            soloGame.multiplier = 1.00;
            soloGame.tickCounter = 0;
            soloGame.gridOffset = 0;
            soloGame.points = [{tick: 0, mult: 1.00}];
            soloGame.statusText = "🚀 개인전 그래프 상승 중!";
            soloGame.statusColor = '#fff';

            const rand = Math.random();
            if (rand < 0.02) soloGame.crashPoint = 1.00;
            else if (rand < 0.47) soloGame.crashPoint = 1.01 + Math.random() * 1.4;
            else if (rand < 0.87) soloGame.crashPoint = 2.40 + Math.random() * 3.6;
            else soloGame.crashPoint = 6.00 + Math.random() * 14.0;

            if (soloGame.crashPoint === 1.00) {
                setTimeout(() => { crashSoloGame(); }, 100);
                return;
            }

            soloGameInterval = setInterval(() => {
                soloGame.tickCounter += 1;
                let speed = 0.0003 + (Math.pow(soloGame.tickCounter, 2) * 0.00000012);
                soloGame.multiplier += speed;
                soloGame.gridOffset += soloGame.multiplier * 1.3;
                soloGame.points.push({tick: soloGame.tickCounter, mult: soloGame.multiplier});

                // 자동 익절 탈출 검사
                if (soloGame.isBetLocked && soloGame.subMode === 'GRAPH' && !soloGame.hasCashedOut) {
                    const targetVal = parseFloat(document.getElementById('target-input').value);
                    if (!isNaN(targetVal) && soloGame.multiplier >= targetVal) {
                        triggerSoloCashOutLogic();
                    }
                }

                if (soloGame.multiplier >= soloGame.crashPoint) {
                    soloGame.multiplier = soloGame.crashPoint;
                    clearInterval(soloGameInterval);
                    crashSoloGame();
                }
                updateUIElements();
            }, 30);
        }

        function triggerSoloCashOutLogic() {
            if (soloGame.state !== 'RUNNING' || soloGame.hasCashedOut || soloGame.betAmount <= 0) return;
            soloGame.hasCashedOut = true;
            let finalReturn = Math.floor(soloGame.betAmount * soloGame.multiplier);
            userBalance += finalReturn;
            updateBalanceDOM();
            soloGame.statusText = `💰 개인전 익절 완료! +${finalReturn.toLocaleString()}원!`;
            triggerSingleConfetti();
            updateUIElements();
        }

        function crashSoloGame() {
            soloGame.state = 'CRASHED';
            const lastDigit = parseInt((soloGame.multiplier * 100).toFixed(0).slice(-1));
            const oe = (lastDigit % 2 !== 0) ? '홀' : '짝';

            let finalSummaryText = "";
            let isWin = false;

            if (soloGame.isBetLocked) {
                if (soloGame.subMode === 'OE') {
                    const mapped = (soloGame.selectedOE === 'ODD') ? '홀' : '짝';
                    if (mapped === oe) {
                        isWin = true;
                        let reward = Math.floor(soloGame.betAmount * 1.98);
                        userBalance += reward;
                        finalSummaryText = `개인전 홀짝 적중! 🎉 +${reward.toLocaleString()}원`;
                    } else {
                        finalSummaryText = `개인전 낙첨 💀 -${soloGame.betAmount.toLocaleString()}원`;
                    }
                } else {
                    if (soloGame.hasCashedOut) {
                        isWin = true;
                        finalSummaryText = "개인전 탈출 성공! 🎉";
                    } else {
                        finalSummaryText = `개인전 탈출 실패 💀 -${soloGame.betAmount.toLocaleString()}원`;
                    }
                }
            } else {
                finalSummaryText = "개인전 관전 종료";
            }

            soloGame.statusText = finalSummaryText;
            soloGame.statusColor = isWin ? 'var(--neon-green)' : 'var(--neon-pink)';

            if (isWin && soloGame.isBetLocked && soloGame.subMode === 'OE') triggerSingleConfetti();

            updateBalanceDOM();
            updateHistory(soloGame.multiplier, oe);

            if (mainTab === 'SOLO') {
                resultArea.style.display = 'block';
                screenBox.classList.add('shake');
                document.getElementById('res-final-mult').innerText = `${soloGame.multiplier.toFixed(2)}x`;
                document.getElementById('res-last-digit').innerText = `${lastDigit} (${oe})`;
                document.getElementById('res-final-status').innerText = finalSummaryText;
                document.getElementById('res-final-status').style.color = isWin ? 'var(--neon-green)' : 'var(--neon-pink)';
                document.getElementById('team-round-report').style.display = 'none';
            }

            updateUIElements();
            setTimeout(() => { loopSoloCountdown(); }, 3000);
        }

        // ☠️ [엔진 2 Logic] 독박 단체전 모드 루프 제어

        function addMember() {
            if (teamGame.state === 'COUNTDOWN' || teamGame.state === 'RUNNING') return;
            if (teamMembers.length >= 10) return;
            const nextId = teamMembers.length > 0 ? Math.max(...teamMembers.map(m => m.id)) + 1 : 1;
            teamMembers.push({ id: nextId, name: `유저${nextId}`, alive: true });
            buildTeamUI();
            refreshTeamUIState();
        }

        function removeMember() {
            if (teamGame.state === 'COUNTDOWN' || teamGame.state === 'RUNNING') return;
            if (teamMembers.length <= 2) return;
            teamMembers.pop();
            buildTeamUI();
            refreshTeamUIState();
        }

        function updateMemberName(id, val) {
            let m = teamMembers.find(x => x.id === id);
            if (m) m.name = val;
        }

        function refreshTeamUIState() {
            let endangeredCount = teamMembers.filter(v => v.alive).length;
            document.getElementById('team-board-title').innerText = `☠️ 제 ${teamRound}라운드 독박 서바이벌 (${endangeredCount}명 잔류)`;
            const submitBtn = document.getElementById('btn-team-submit');
            
            if (teamGame.state === 'COUNTDOWN' || teamGame.state === 'RUNNING') {
                submitBtn.disabled = true;
                submitBtn.style.opacity = "0.5";
                submitBtn.innerText = "🔒 단체전 진행 중...";
            } else if (teamGame.state === 'FINISHED') {

                    submitBtn.innerText = `⏭️ 다음 라운드 진행 (${endangeredCount}명)`;
                } else {
                    submitBtn.disabled = true;
                    submitBtn.innerText = "🏆 최종 독박 확정!";

                submitBtn.style.opacity = "1";
                submitBtn.style.background = "var(--neon-green)";
                submitBtn.innerText = "🚨 준비 완료 / 단체전 시작";

            teamMembers.forEach(m => {
                const row = document.getElementById(`member-row-${m.id}`);
                const nameInp = document.getElementById(`member-name-${m.id}`);
                const targetInp = document.getElementById(`target-team-${m.id}`);

                if (!m.alive) {
                    row.className = 'member-row saved';

                    targetInp.disabled = true;
                } else {

        function handleTeamAction() {
            if (teamGame.state === 'IDLE') {
                let endangered = teamMembers.filter(m => m.alive);
                let unchosen = endangered.filter(m => {
                    const input = document.getElementById(`target-team-${m.id}`);
                    return !input || input.value.trim() === '';
                });
                if (unchosen.length > 0) return alert("모든 살아있는 생존자의 목표 배수를 적어주세요!");

            teamGameInterval = setInterval(() => {
                teamGame.tickCounter += 1;

        function crashTeamGame() {
            teamGame.state = 'FINISHED';
            const lastDigit = parseInt((teamGame.multiplier * 100).toFixed(0).slice(-1));
            const oe = (lastDigit % 2 !== 0) ? '홀' : '짝';

            let aliveMembers = teamMembers.filter(m => m.alive);
            let results = aliveMembers.map(m => {
                const input = document.getElementById(`target-team-${m.id}`);
                const target = input ? parseFloat(input.value) : 0;
                return { ...m, target: target || 0, diff: Math.abs((target || 0) - teamGame.multiplier) };
            });

            results.sort((a, b) => b.diff - a.diff); // 오차가 가장 큰 사람이 0등(꼴찌)
            const loser = results[0];

            const targetUser = teamMembers.find(m => m.id === loser.id);

            if (mainTab === 'TEAM') {
                resultArea.style.display = 'block';
                screenBox.classList.add('shake');
                document.getElementById('res-final-mult').innerText = `${teamGame.multiplier.toFixed(2)}x`;

            }

            const megaBanner = document.getElementById('mega-banner');
            megaBanner.innerHTML = `

                <div style="font-size: 1.4rem; color: var(--neon-blue); line-height:1.4;">이지까까브로<br>ㅋㅋㅋㅋㅋㅋㅋㅋ</div>
                <button onclick="closeMegaBanner()" style="background:var(--neon-pink); color:#fff; border:none; padding:8px 20px; border-radius:4px; margin-top:15px; font-family:'DungGeunMo'; cursor:pointer;">닫기</button>

        // ==========================================
        // 🖥️ 공용 모니터링 & 그래픽 통합 처리 부
        // ==========================================
        function updateUIElements() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. 활성화된 탭의 내부 상태 정보 불러오기
            let activeGame = (mainTab === 'SOLO') ? soloGame : teamGame;
            let currentMaxY = Math.max(1.20, activeGame.multiplier);
            let currentMaxTick = Math.max(30, activeGame.tickCounter);

            drawGrid(currentMaxY, currentMaxTick, activeGame.gridOffset);
            
            // 2. 궤적 선 그리기
            if (activeGame.state === 'RUNNING' || activeGame.state === 'CRASHED' || activeGame.state === 'FINISHED') {
                if (activeGame.points.length >= 2) {
                    ctx.save();
                    ctx.strokeStyle = '#ff007f'; ctx.lineWidth = 4; ctx.shadowBlur = 10; ctx.shadowColor = '#ff007f';
                    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
                    activeGame.points.forEach((p, idx) => {
                        const reX = paddingLeft + (p.tick / currentMaxTick) * plotWidth;
                        const reY = (canvas.height - paddingBottom) - ((p.mult - 1.0) / (currentMaxY - 1.0)) * plotHeight;
                        if (idx === 0) ctx.moveTo(reX, reY);
                        else ctx.lineTo(reX, reY);
                    });
                    ctx.stroke();
                    
                    const lastP = activeGame.points[activeGame.points.length - 1];
                    const headX = paddingLeft + (lastP.tick / currentMaxTick) * plotWidth;
                    const headY = (canvas.height - paddingBottom) - ((lastP.mult - 1.0) / (currentMaxY - 1.0)) * plotHeight;
                    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(headX, headY, 5, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
            }

            // 3. 중앙 오버레이 배수 텍스트 제어
            if (activeGame.state === 'RUNNING' || activeGame.state === 'CRASHED' || activeGame.state === 'FINISHED') {
                multDisplay.style.display = 'block';
                if (activeGame.state === 'CRASHED' || activeGame.state === 'FINISHED') {
                    if (mainTab === 'SOLO') {
                        const lastDigit = parseInt((soloGame.multiplier * 100).toFixed(0).slice(-1));
                        multDisplay.innerText = `${soloGame.multiplier.toFixed(2)}x (${lastDigit % 2 !== 0 ? '홀' : '짝'})`;
                    } else {
                        multDisplay.innerText = `${teamGame.multiplier.toFixed(2)}x`;
                    }
                    multDisplay.style.color = 'var(--neon-pink)';
                } else {
                    multDisplay.innerText = activeGame.multiplier.toFixed(2) + 'x';
                    multDisplay.style.color = 'var(--neon-green)';
                }
            } else {
                multDisplay.style.display = 'none';
            }

            // 4. 중앙 카운트다운 숫자 제어
            if (activeGame.state === 'COUNTDOWN') {
                countdownDisplay.style.display = 'block';
                countdownDisplay.innerText = activeGame.countdownLeft.toFixed(2);
            } else {
                countdownDisplay.style.display = 'none';
            }

            // 5. 하단 텍스트 전광판 제어
            statusDisplay.innerText = activeGame.statusText;
            statusDisplay.style.color = activeGame.statusColor;

            // 6. [중요] 개인전 수동 탈출(Cashout) 버튼 활성화 연동
            // 개인전이 활발히 진행 중이며 그래프 배팅이 수동/자동 상태로 익절 대기 중이라면 어느 탭에서든 표시
            if (soloGame.state === 'RUNNING' && soloGame.isBetLocked && soloGame.subMode === 'GRAPH') {
                if (!soloGame.hasCashedOut) {
                    cashoutBtn.style.display = 'block';
                    cashoutBtn.style.opacity = '1';
                    let currentEarn = Math.floor(soloGame.betAmount * soloGame.multiplier);
                    cashoutBtn.innerText = `💸 지금 탈출하기 (적립: ${currentEarn.toLocaleString()}원 / ${soloGame.multiplier.toFixed(2)}x)`;
                } else {
                    cashoutBtn.style.display = 'block';
                    cashoutBtn.style.opacity = '0.5';
                    cashoutBtn.innerText = `✅ 탈출 성공 상태 (백그라운드 완료)`;
                }
            } else {
                cashoutBtn.style.display = 'none';
            }

            // 7. 패널 조작 잠금 연동
            if (mainTab === 'SOLO') {
                if (soloGame.state !== 'COUNTDOWN' || soloGame.isBetLocked) {
                    document.getElementById('solo-ui-group').classList.add('disabled-panel');
                } else {
                    document.getElementById('solo-ui-group').classList.remove('disabled-panel');
                }
            }
        }

        function drawGrid(currentMaxY, currentMaxTick, offset) {
            ctx.save();
            ctx.strokeStyle = '#151526'; ctx.lineWidth = 1; ctx.beginPath();
            let scrollX = offset % 40;
            for (let x = paddingLeft + 40 - scrollX; x < canvas.width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height - paddingBottom); }
            for (let y = canvas.height - paddingBottom - 40; y > 0; y -= 40) { ctx.moveTo(paddingLeft, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();

            ctx.strokeStyle = '#3d3d5e'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.moveTo(paddingLeft, 0); ctx.lineTo(paddingLeft, canvas.height - paddingBottom); ctx.lineTo(canvas.width, canvas.height - paddingBottom); ctx.stroke();

            ctx.fillStyle = '#8b8ba8'; ctx.font = '10px DungGeunMo'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
            const totalSec = currentMaxTick / (1000 / 30);
            for (let sec = 0; sec <= totalSec + 5; sec += 5) {
                let t = sec * (1000 / 30);
                let tickX = paddingLeft + (t / currentMaxTick) * plotWidth;
                if (tickX <= canvas.width && tickX >= paddingLeft) {
                    ctx.fillText(sec + '초', tickX, canvas.height - paddingBottom + 6);
                }
            }
            ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
            let intervalY = currentMaxY <= 3.0 ? 0.2 : Math.ceil((currentMaxY - 1) / 5);
            for (let m = 1.0; m <= currentMaxY + 0.01; m += intervalY) {
                let tickY = (canvas.height - paddingBottom) - ((m - 1.0) / (currentMaxY - 1.0)) * plotHeight;
                if (tickY >= 0 && tickY <= canvas.height - paddingBottom) {
                    ctx.fillText(m.toFixed(1), paddingLeft - 8, tickY);
                }
            }
            ctx.restore();
        }

        function updateHistory(mult, oe) {
            historyData.unshift({ mult: mult, oe: oe });
            if (historyData.length > 20) historyData.pop();
            historyBox.innerHTML = '';
            historyData.forEach(h => {
                const colorClass = (h.oe === '홀') ? 'bg-odd' : 'bg-even';
                const div = document.createElement('div');
                div.className = `history-item`;
                div.innerHTML = `<span class="badge ${colorClass}">${h.oe}</span> ${h.mult.toFixed(2)}x`;
                historyBox.appendChild(div);
            });
        }

        function triggerSingleConfetti() { confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } }); }
        function triggerMassiveConfetti() {
            const duration = 3000; const animationEnd = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: ['#ff007f', '#00f0ff'] });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: ['#39ff14', '#ffea00'] });
                if (Date.now() < animationEnd) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
